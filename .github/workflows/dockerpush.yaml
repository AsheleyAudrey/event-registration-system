name: Docker Compose Build, Push, and Run

on:
  push:
    branches:
      - production

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up Docker Buildx (for advanced builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.USERNAME }}" --password-stdin

      # Step 4: Build the Docker image
      - name: Build Docker Image
        run: docker build -t "${{ secrets.IMAGE_NAME }}:latest" .

      # Step 5: Push the Docker image to Docker Hub
      - name: Push Docker Image
        run: docker push "${{ secrets.IMAGE_NAME }}:latest"